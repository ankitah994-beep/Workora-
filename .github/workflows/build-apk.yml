name: Android CI (Auto Storage Clean)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Delete All Old APK Artifacts to Free Storage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts --paginate -q '.artifacts[].id' | while read -r artifact_id; do
            if [ -n "$artifact_id" ]; then
              gh api -X DELETE repos/${{ github.repository }}/actions/artifacts/"$artifact_id" || true
            fi
          done

      - name: Upload Latest APK (Auto-Expires in 1 Day)
        uses: actions/upload-artifact@v4
        with:
          name: Workora-Latest-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1
          overwrite: true
